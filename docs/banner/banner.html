<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Kakudai banner</title>
<!-- Source of docs/banner.png (1600 x 720). Regenerate with docs/banner/render.ps1 (headless Edge, nothing downloaded). The window images are
     docs/window.png and docs/options.png (2x screenshots of the app page, 430 px window + 40/28 px margins). -->
<style>
  @font-face { font-family: "Instrument Serif"; src: url("../../src/Kakudai.App/wwwroot/fonts/instrument-serif-latin-400-normal.woff2") format("woff2"); }
  @font-face { font-family: "Inter"; src: url("../../src/Kakudai.App/wwwroot/fonts/inter-latin-wght-normal.woff2") format("woff2"); font-weight: 100 900; }
  @font-face { font-family: "JetBrains Mono"; src: url("../../src/Kakudai.App/wwwroot/fonts/jetbrains-mono-latin-400-normal.woff2") format("woff2"); }

  :root {
    --bg: #0b0b0c;
    --ink: #ededef;
    --muted: #8f8f96;
    --dim: #9a9aa1;
    --accent: #f06ba8;
    --ok: #6cc98e;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    width: 1600px; height: 720px; overflow: hidden; position: relative;
    background:
      radial-gradient(900px 620px at 1180px 300px, #17141a 0%, transparent 70%),
      radial-gradient(600px 400px at 1250px 720px, rgb(240 107 168 / 0.06) 0%, transparent 70%),
      var(--bg);
    color: var(--ink);
    font-family: "Inter", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  /* Approach rings opening out from the logo in the front window's title bar, barely visible. */
  .rings { position: absolute; left: 0; top: 0; width: 1600px; height: 720px; pointer-events: none; }
  .rings circle { fill: none; stroke: #fff; }

  .text { position: absolute; left: 96px; top: 152px; width: 680px; }
  .clients {
    display: flex; align-items: center; gap: 14px; margin: 0;
    font-family: "JetBrains Mono", monospace; font-size: 23px; letter-spacing: 0.02em; color: #c4c4c9;
  }
  .clients .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 12px rgb(108 201 142 / 0.6); }
  .clients .sep { color: #5c5c63; }

  h1 {
    position: relative; display: inline-block;
    margin: 30px 0 0 -6px;
    font-family: "Instrument Serif", serif; font-weight: 400;
    font-size: 168px; line-height: 0.86; letter-spacing: -0.01em;
  }
  .kanji {
    position: absolute; left: calc(100% + 22px); top: 14px;
    writing-mode: vertical-rl; letter-spacing: 0.18em;
    font-family: "Yu Mincho", "YuMincho", "MS Mincho", serif; font-size: 24px; color: #5c5c63;
  }

  .tagline { margin: 44px 0 0; font-size: 35px; line-height: 1.3; color: #9a9aa1; letter-spacing: -0.005em; }
  .tagline b { font-weight: 400; color: var(--ink); }
  .tagline .hl { color: var(--accent); }
  .sub { margin: 30px 0 0; font-size: 20px; color: #75757c; white-space: nowrap; }

  /* Windows on the right, fading out like the screenshots of the MapMatcher banner. */
  .shot { position: absolute; }
  .shot img { display: block; width: 510px; height: 720px; }
  .front { left: 780px; top: 32px; z-index: 2;
    -webkit-mask-image: linear-gradient(180deg, #000 0%, #000 52%, transparent 84%); }
  .back { left: 1150px; top: 92px; z-index: 1; opacity: 0.5; filter: saturate(0.85);
    -webkit-mask-image:
      linear-gradient(180deg, #000 0%, #000 50%, transparent 85%),
      linear-gradient(90deg, transparent 0px, transparent 100px, #000 128px, #000 45%, transparent 88%);
    -webkit-mask-composite: source-in; }   /* hidden where the front window covers it, even where that one fades */
</style>
</head>
<body>
  <svg class="rings" viewBox="0 0 1600 720" aria-hidden="true">
    <circle cx="843" cy="82" r="190" stroke-opacity="0.05" stroke-width="1.5" />
    <circle cx="843" cy="82" r="330" stroke-opacity="0.035" stroke-width="1.5" />
    <circle cx="843" cy="82" r="500" stroke-opacity="0.025" stroke-width="1.5" />
    <circle cx="843" cy="82" r="700" stroke-opacity="0.018" stroke-width="1.5" />
  </svg>

  <div class="text">
    <p class="clients"><span class="dot"></span>osu!lazer <span class="sep">·</span> Torii</p>
    <h1>Kakudai<span class="kanji">拡大</span></h1>
    <p class="tagline">Your osu! maps, <b class="hl">spaced out</b>. <b>Same rhythm</b>, every note <b>in the playfield</b>.</p>
    <p class="sub">Spacing, BPM, AR/OD, HR and flips in one click. A native Windows app.</p>
  </div>

  <div class="shot back"><img src="../options.png" alt=""></div>
  <div class="shot front"><img src="../window.png" alt=""></div>
</body>
</html>
